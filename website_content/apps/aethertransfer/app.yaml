name: AetherTransfer
order: 9
repo: https://github.com/bcblr1993/AetherTransfer
icon: ./media/icon.png
minimumSystemVersion: "26.0"
tech: [Swift 6, SwiftUI, AppKit, Liquid Glass, libcurl, libssh2]
tagline:
  zh: 原生文件传输工作台，让每一步清楚可控
  en: A native file transfer workspace, clear at every step
summary:
  zh: "面向 Apple 芯片 Mac 的原生文件传输客户端，开发候选提供双栏浏览、FTP / FTPS / SFTP / WebDAV 与 S3 文件和目录传输、任务管理与冲突处理。以 Transmit 的完整文件工作流为功能目标，采用 macOS 26 Liquid Glass 界面。"
  en: "A native file transfer client for Apple silicon Mac. The development candidate includes dual-pane browsing, FTP / FTPS / SFTP / WebDAV and S3 file transfers, a task queue and conflict choices, with Transmit workflow parity as the goal and a macOS 26 Liquid Glass interface."
platforms:
  - id: mac
    status: dev
    requirement: { zh: Apple 芯片 · macOS 26.0+, en: Apple silicon · macOS 26.0+ }
notice:
  zh: 开发中，尚未发布安装包。协议兼容性与完整功能仍在验证。
  en: In development. No installer has been released; protocol compatibility and full functionality are still being verified.
hero:
  eyebrow: { zh: 文件传输 · 原生 Mac · 开发中, en: File transfer · Native Mac · In development }
  title: { zh: "文件两端，\n尽在掌握。", en: "Two sides.\nOne clear workspace." }
  lead:
    zh: "在一个原生窗口中浏览本地与远程文件，掌握连接与传输状态。\n开发候选已加入 S3 前缀浏览、目录同步与文本编辑；各协议的完整工作流仍在开发和验收。"
    en: "Browse local and remote files in one native window, with clear connection and transfer status.\nThe development candidate includes S3 prefix browsing, folder sync and text editing; complete workflows for each protocol are still in development and validation."
  requirements: { zh: Apple 芯片 Mac · macOS 26.0+, en: Apple silicon Mac · macOS 26.0+ }
features:
  eyebrow: { zh: 开发方向, en: Development goals }
  title: { zh: 文件为中心，原生为底色。, en: Focused on files. Native at the core. }
  lead:
    zh: 以下是正在实现的产品方向，实际支持范围以未来版本记录为准。
    en: These are development goals. Actual support will be documented in release notes.
  items:
    - kicker: { zh: 浏览, en: Browse }
      title: { zh: 本地与远程双栏, en: Local and remote, side by side }
      body:
        zh: 文件列表、路径导航与系统快捷键，结合原生工具栏和 Liquid Glass 操作控件。
        en: File lists, path navigation and keyboard shortcuts with native toolbars and Liquid Glass controls.
    - kicker: { zh: 传输, en: Transfer }
      title: { zh: 可靠传输与可见进度, en: Reliable transfers and visible progress }
      body:
        zh: 开发候选提供 FTP / FTPS / SFTP 和 WebDAV（HTTP、HTTPS）、任务队列与冲突处理。单文件可保留进度、重启后核对恢复；WebDAV 下载要求服务器支持 Range，上传须明确选择从头上传。目录任务恢复与完整云服务仍在开发。
        en: The development candidate includes FTP / FTPS / SFTP and WebDAV (HTTP, HTTPS), a task queue and conflict handling. Single-file progress can be retained and verified after restart. WebDAV downloads require server Range support; uploads require an explicit restart. Folder-job recovery and the full cloud service range remain in development.
    - kicker: { zh: 云存储, en: Cloud storage }
      title: { zh: S3 原生文件工作流, en: Native S3 file workflows }
      body:
        zh: 开发候选支持存储桶前缀浏览、文件与递归目录队列传输、空目录和整体进度，以及覆盖 / 跳过 / 保留两份。S3 同步、编辑、预览和重启恢复仍在开发；AWS / R2 实际服务兼容性尚未完成验收。
        en: The development candidate supports bucket-prefix browsing, queued file and recursive folder transfers, empty folders, overall progress and overwrite / skip / keep-both choices. S3 sync, editing, preview and restart recovery remain in development; actual AWS / R2 compatibility has not yet been accepted.
    - kicker: { zh: 隐私, en: Privacy }
      title: { zh: 凭据留在系统钥匙串, en: Credentials in system Keychain }
      body:
        zh: 连接配置保存在本地，密码、口令及用户选择保存的 S3 密钥 / 令牌由 Keychain 管理。SFTP 核对主机密钥，TLS 验证证书。
        en: Local connection profiles with passwords, passphrases and optionally saved S3 keys / tokens in Keychain. SFTP verifies host keys and TLS validates certificates.
    - kicker: { zh: 同步, en: Sync }
      title: { zh: 看清差异，再决定同步, en: Review differences before syncing }
      body:
        zh: 开发候选已加入本地与远程目录的单向、双向差异预览，逐项选择方向与操作。镜像删除默认不选中，预览后文件变化会要求重新比较。
        en: The development candidate includes one-way and two-way previews across local and remote folders, with per-item direction and action choices. Mirror deletions start unchecked; changed files require a new preview.
    - kicker: { zh: 编辑, en: Edit }
      title: { zh: 原生编辑，保存后回传, en: Native editing and save-back }
      body:
        zh: 开发候选支持本地与远程 UTF-8 文本的原生编辑，也可选择本机编辑器，保存后自动回传。检测到原文件内容变化时保留草稿；其他编码、草稿恢复与完整编辑器兼容性仍在开发。
        en: The development candidate supports native editing of local and remote UTF-8 text, or a chosen local editor with automatic save-back. Detected source changes preserve the draft; other encodings, draft recovery and broader editor compatibility remain in development.
faq:
  eyebrow: FAQ
  title: { zh: 常见问题, en: Questions }
  lead: { zh: 关于开发状态与产品定位。, en: Development status and product scope. }
  items:
    - q: { zh: 现在可以下载使用吗？, en: Can I download it now? }
      a: { zh: 目前处于开发阶段，尚未发布安装包。源码与进度会在 GitHub 仓库中更新。, en: It is in development and no installer has been released. Source and progress will be available on GitHub. }
    - q: { zh: 与 ApexTerm 有什么不同？, en: How does it differ from ApexTerm? }
      a: { zh: ApexTerm 专注 SSH 终端与运维；AetherTransfer 专注文件浏览、批量传输、任务管理与目录同步。, en: ApexTerm focuses on SSH terminals and operations. AetherTransfer focuses on file browsing, batch transfers, task management and folder sync. }
    - q: { zh: 是否已经支持全部云服务？, en: Are all cloud services supported already? }
      a: { zh: 还没有。完整目标包含多种云服务，但每一种都需要独立实现与真实验证，未来版本会明确列出支持范围。, en: Not yet. The goal includes multiple cloud services, each requiring its own implementation and real validation. Future releases will specify actual support. }
cta:
  title: { zh: 关注原生文件传输的开发进展。, en: Follow the native file transfer project. }
  note: { zh: 开发中 · macOS 26.0+ · Apple 芯片, en: In development · macOS 26.0+ · Apple silicon }
