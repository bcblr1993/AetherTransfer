name: AetherTransfer
order: 9
repo: https://github.com/bcblr1993/AetherTransfer
icon: ./media/icon.png
minimumSystemVersion: "26.0"
tech: [Swift 6, SwiftUI, AppKit, Liquid Glass, libcurl, libssh2, CryptoKit]
tagline:
  zh: 原生文件传输工作台，让每一步清楚可控
  en: A native file transfer workspace, clear at every step
summary:
  zh: "为 Apple 芯片 Mac 打造的原生文件与对象存储传输工作台。覆盖 SFTP / FTPS / FTP、WebDAV、S3 / R2、Backblaze B2、Azure Blob 与 OpenStack Swift；支持级联分栏、画廊预览、三标签检查器、规则过滤、脱敏日志与零知识加密配置同步。"
  en: "A native file and object storage workspace for Apple silicon Macs. Supports SFTP / FTPS / FTP, WebDAV, S3 / R2, Backblaze B2, Azure Blob, and OpenStack Swift with Miller columns, Gallery preview, a 3-tab inspector, skip rules, redacted transcripts, and encrypted bookmark sync."
platforms:
  - id: mac
    status: available
    requirement: { zh: Apple 芯片 · macOS 26.0+, en: Apple silicon · macOS 26.0+ }
cardStats:
  - value: "10 种协议模式"
    label: { zh: SFTP·FTPS·FTP·WebDAV·S3·B2·Azure·Swift, en: "SFTP, FTPS, FTP, WebDAV, S3, B2, Azure, Swift" }
  - value: "原生 / Native"
    label: { zh: SwiftUI 与 Liquid Glass, en: SwiftUI and Liquid Glass }
  - value: "本机 / Local"
    label: { zh: Keychain 凭据 · 脱敏日志 · 无追踪, en: "Keychain · Redacted Logs · No Tracking" }
notice:
  zh: "0.2.0 全面对齐高效双栏与云端传输工作流：新增显式 FTPS、WebDAV/HTTPS、S3/R2/MinIO、Backblaze B2、Azure Blob 与 OpenStack Swift，带来 Miller 分栏、画廊预览、Servers Launchpad、三标签检查器、Skip Rules、脱敏协议日志、Finder Droplets 与 .aethersync 加密书签同步。"
  en: "Version 0.2.0 expands to Explicit FTPS, WebDAV/HTTPS, S3/R2/MinIO, Backblaze B2, Azure Blob, and OpenStack Swift, adding cascading Miller columns, Gallery split view, Servers Launchpad, a 3-tab Inspector, Skip Rules, redacted Transcripts, Finder Droplets, and .aethersync encrypted vault sync."
hero:
  eyebrow: { zh: 文件传输 · 原生 Mac, en: File transfer · Native Mac }
  title: { zh: "文件两端，\n尽在掌握。", en: "Two sides.\nOne clear workspace." }
  lead:
    zh: "在一个原生窗口中并排连接服务器与对象存储，拖放即可上传下载。\n每个任务的进度、校验与协议日志都清楚可见，失败不会被当作成功。"
    en: "Connect servers and object storage side by side in one native window, and drag to upload or download.\nEvery task shows its progress, verification, and redacted protocol transcript, and a failure is never reported as a success."
  requirements: { zh: Apple 芯片 Mac · macOS 26.0+, en: Apple silicon Mac · macOS 26.0+ }
features:
  eyebrow: { zh: 当前版本功能, en: In the current version }
  title: { zh: 文件为中心，原生为底色。, en: Focused on files. Native at the core. }
  lead:
    zh: 以下均为当前版本已包含、经过单元测试与本地隔离协议集成测试验证的能力。
    en: Everything below ships in the current version and is covered by unit tests and local loopback protocol integration tests.
  items:
    - kicker: { zh: 协议, en: Protocols }
      title: { zh: 传统服务器与云对象存储全覆盖, en: "Servers and cloud object storage in one place" }
      body:
        zh: 支持 SFTP、FTP、隐式 FTPS、显式 FTPS (AUTH TLS)、WebDAV / WebDAV HTTPS、Amazon S3 / Cloudflare R2 / MinIO（SigV4 与分段上传）、Backblaze B2、Microsoft Azure Blob 与 OpenStack Swift。
        en: Supports SFTP, FTP, Implicit FTPS, Explicit FTPS (AUTH TLS), WebDAV / WebDAV HTTPS, Amazon S3 / Cloudflare R2 / MinIO (SigV4 and multipart upload), Backblaze B2, Microsoft Azure Blob, and OpenStack Swift.
    - kicker: { zh: 浏览, en: Browse }
      title: { zh: 多种视图、启动台与灵活双栏, en: "Four views, Launchpad, and flexible panes" }
      body:
        zh: 提供列表、级联 Miller 分栏、缩略图网格与画廊预览视图，支持聚焦模式、本地⇄本地及服务器⇄服务器双栏传输。Servers Launchpad 支持颜色标签筛选、文件夹关联与自定义常用位置，多标签独立保留连接快照。
        en: Switch between List, cascading Miller Columns, resizable Thumbnail Grid, and Gallery Split views, with Focus Mode and Local⇄Local or Server⇄Server pane switching. Servers Launchpad adds color tags, Folder Linking, and Custom Places alongside per-tab connection snapshots.
    - kicker: { zh: 传输与日志, en: Transfer & Log }
      title: { zh: 可靠队列与严格脱敏协议日志, en: "Reliable queue and redacted transcripts" }
      body:
        zh: 有界并发队列支持暂停、取消、置顶、一键重试、限速、Merge 文件夹合并与断点续传。底部抽屉集成可筛选的协议日志（Transcript），自动脱敏密码、Token 与 URL 凭据。
        en: A bounded concurrent queue supports pause, cancel, move to top, retry all failed, bandwidth limits, folder merge, and verified resume. The bottom drawer includes a searchable Transcript log that automatically redacts passwords, tokens, and URL userinfo.
    - kicker: { zh: 同步与规则, en: Sync & Rules }
      title: { zh: 谓词规则过滤，先预览再同步, en: "Rule-filtered sync with item-by-item preview" }
      body:
        zh: 单向或双向比较生成预览计划并支持 Markdown 报告导出，默认不删除远程多余文件。自定义 Skip Rules 谓词与 ASCII 扩展名可统一作用于浏览、传输与同步。
        en: Build one-way or two-way sync plans with Markdown report export while preserving remote extras by default. Custom Skip Rules predicates and ASCII extensions apply consistently across browsing, transfers, and sync.
    - kicker: { zh: 检查器与编辑, en: Inspector & Edit }
      title: { zh: 三标签检查器与外部编辑回传, en: "3-tab Inspector and live external editor" }
      body:
        zh: 检查器（⌘I）提供文件夹大小计算、分块 SHA-256 / MD5 校验、递归 POSIX 权限修改、云端对象元数据编辑与 Presigned / SAS 临时签名链接；支持内置编辑器及外部编辑器保存后自动回传，联动 ApexTerm 或「终端」。
        en: The 3-tab Inspector (⌘I) provides Folder Size calculation, chunked SHA-256 / MD5 checksums, recursive POSIX chmod, cloud metadata editing, and Presigned / SAS URLs. Edit with the built-in editor or watch external editors to auto-upload on save, and open ApexTerm or Terminal at the current path.
    - kicker: { zh: 安全与自动化, en: Security & Automation }
      title: { zh: 密钥管理、Droplets 与加密书签同步, en: "SSH keys, Droplets, and encrypted vault" }
      body:
        zh: SFTP 验证主机密钥、FTPS/HTTPS 校验证书，支持 SSH Agent、`~/.ssh/config` 导入与 Ed25519 / RSA-4096 密钥生成。支持导出 Finder Droplets 微应用、菜单栏微件、`.aethersync` 零知识加密保险箱与验证后的应用内更新。
        en: SFTP verifies host keys and FTPS/HTTPS validate TLS certificates, with SSH Agent, `~/.ssh/config` import, and Ed25519 / RSA-4096 key generation. Export Finder Droplet apps, use the Menu Bar Droplet, sync bookmarks via `.aethersync` encrypted vaults, and install verified in-app updates.
faq:
  eyebrow: FAQ
  title: { zh: 常见问题, en: Questions }
  lead: { zh: 关于下载、协议与产品定位。, en: "Downloads, protocols and product scope." }
  items:
    - q: { zh: 如何安装？, en: How do I install it? }
      a: { zh: 下载 DMG 后将 AetherTransfer 拖入“应用程序”即可。安装包经过 Developer ID 签名与 Apple 公证，之后可在应用内检查更新。, en: "Download the DMG and drag AetherTransfer into Applications. The installer is signed with Developer ID and notarized by Apple, and later versions can be installed from inside the app." }
    - q: { zh: 支持哪些协议？, en: Which protocols are supported? }
      a: { zh: 支持 SFTP、FTP、隐式/显式 FTPS、WebDAV / WebDAV HTTPS、Amazon S3 / Cloudflare R2 / MinIO、Backblaze B2、Microsoft Azure Blob 与 OpenStack Swift。需要第三方 OAuth 应用凭据的消费级网盘（Box、Dropbox、Google Drive、OneDrive）暂不包含。, en: "Supports SFTP, FTP, Implicit and Explicit FTPS, WebDAV / WebDAV HTTPS, Amazon S3 / Cloudflare R2 / MinIO, Backblaze B2, Microsoft Azure Blob, and OpenStack Swift. Consumer OAuth drives (Box, Dropbox, Google Drive, OneDrive) require third-party OAuth app credentials and are not included." }
    - q: { zh: 与 ApexTerm 有什么不同？, en: How does it differ from ApexTerm? }
      a: { zh: ApexTerm 专注 SSH 终端与运维；AetherTransfer 专注文件浏览、对象存储、批量传输、任务管理与目录同步，也可以从当前位置直接打开 ApexTerm 或系统「终端」。, en: "ApexTerm focuses on SSH terminals and operations. AetherTransfer focuses on file browsing, object storage, batch transfers, task management, and folder sync, and can launch ApexTerm or Terminal at the current location." }
    - q: { zh: 会收集我的数据吗？, en: Does it collect my data? }
      a: { zh: 不会。没有分析埋点、广告或云端账号要求；凭据存于系统 Keychain，协议日志自动脱敏；应用只在检查更新时访问 GitHub，在连接或传输时访问你指定的服务器。, en: "No. There are no analytics, ads, or cloud accounts. Credentials live in the system Keychain, protocol transcripts are automatically redacted, and the app contacts only GitHub for update checks and the servers you configure." }
cta:
  title: { zh: 原生文件传输，从这里开始。, en: Native file transfer starts here. }
  note: { zh: 免费 · macOS 26.0+ · Apple 芯片, en: Free · macOS 26.0+ · Apple silicon }
