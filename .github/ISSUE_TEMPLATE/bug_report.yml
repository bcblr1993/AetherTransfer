name: Bug report
description: Report a reproducible problem (no credentials or private server details).
body:
  - type: textarea
    id: behavior
    attributes:
      label: Steps, expected behavior and actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App / macOS version and protocol
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
